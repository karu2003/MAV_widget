# Winmate GCS overrides — install to /etc/default/gcs-ap-streaming
#   sudo install -m 644 config/gcs-ap-streaming.winmate.conf /etc/default/gcs-ap-streaming
#
# Topology on Winmate:
#   usb0  = built-in Microhard radio (192.168.53.1)   RADIO_IF, RADIO_BUILTIN=1
#   eth0  = SoC Ethernet WAN (internet)               INTERNET_IFS
#   eth1  = USB debug (DHCP)
#   wlan0 = Wi-Fi client (optional internet uplink)
#   uap0  = AP for phones (192.168.54.1)

# --- Network interface roles ---
RADIO_IF=usb0
RADIO_IP=192.168.53.1/24
RADIO_BUILTIN=1
# Phones on the AP get internet from the WAN (and Wi-Fi client if connected).
INTERNET_IFS="eth0 wlan0"

AP_IP=192.168.54.1
AP_BCAST=192.168.54.255

# MAVLink (MAVProxy)
MAV_AP_BCAST_PORT=14550
MAV_AP_IN_PORT=14550

# Video RTSP (ffmpeg listens on AP_IP)
RTSP_PORT=8554
RTSP_PATH=/stream

# Video source: udp (companion / QGC-style H.264 UDP), v4l2, or test
VIDEO_MODE=udp
# Port the drone streams H.264/RTP to (QGC default). The relay RAW-taps this
# port on the radio link so local QGC keeps receiving on :5600 unchanged.
VIDEO_UDP_PORT=5600
VIDEO_UDP_BIND=127.0.0.1
# Video H.264 UDP arrives on the radio link.
VIDEO_IFACE=usb0
# Internal port the relay copies to for the RTSP publisher (ffmpeg/SDP).
VIDEO_FWD_PORT=5601
GCS_WLAN_CONNECTION=
VIDEO_DEVICE=/dev/video0
VIDEO_V4L2_SIZE=1280x720
VIDEO_V4L2_FPS=30
